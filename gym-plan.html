.day{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin:8px 0 14px}
.day h2{font-size:34px;line-height:1.05}.day p{margin:2px 0 0;color:var(--mut)}

.grp{font:700 20px "Barlow Condensed",sans-serif;color:var(--mut);margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden;display:grid;grid-template-columns:minmax(0,340px) 1fr}
.card.done{opacity:.6}
.art{background:var(--soft);padding:12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.art svg{width:100%;height:auto;display:block;background:var(--card);border-radius:10px}
.chips{display:flex;gap:6px}.chips button{flex:1;font:500 13px Barlow,sans-serif;padding:5px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.body{padding:14px 18px 16px;min-width:0}
.top{display:flex;gap:10px;align-items:flex-start}
.top h3{font-size:26px;line-height:1.1;flex:1}.badge{font:600 14px Barlow,sans-serif;background:var(--acc);color:var(--onacc);padding:3px 10px;border-radius:999px;white-space:nowrap}
.chk{width:26px;height:26px;accent-color:var(--acc);flex:none;margin:0;cursor:pointer}
.meta{color:var(--mut);font-size:14px;margin:4px 0 10px}
h4{margin:12px 0 4px;font:600 15px Barlow,sans-serif}
.body p{margin:0}.body ol{margin:0;padding-left:20px}.body li{margin:2px 0}
.avoid{color:var(--mut)}
.wk{display:flex;gap:6px;margin:6px 0 0}.wk button{font:600 13px Barlow,sans-serif;padding:4px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer}.wk button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
@media (max-width:680px){.card{grid-template-columns:1fr}.art{border-right:0;border-bottom:1px solid var(--line)}header h1{font-size:34px}}

const key=(d,k)=>'gym:'+d+':'+k;
const get=k=>{try{return localStorage.getItem(k)==='1'}catch(e){return false}},set=(k,v)=>{try{v?localStorage.setItem(k,'1'):localStorage.removeItem(k)}catch(e){}};
function tabs(){$('#tabs').innerHTML=DAYS.map((d,i)=>`<button role="tab" aria-selected="${i==cur}" data-i="${i}">${d[0]}<small>${d[4].map(g=>g[0]).slice(0,1)}</small></button>`).join('');
 $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;tabs();day();scrollTo({top:0})})}
function card(dk,id,n){const t=T[id],e=X[id],full=id;
 return `<article class="card" data-id="${id}"><div class="art"><svg viewBox="0 0 240 150" role="img" aria-label="Animated diagram: ${t[0]}"><g></g></svg><div class="chips" role="group" aria-label="Diagram view"><button data-m="play" aria-pressed="${!reduce}">Play</button><button data-m="A" aria-pressed="${reduce}">Start</button><button data-m="B" aria-pressed="false">Finish</button></div></div>
 <div class="body"><div class="top"><input class="chk" type="checkbox" aria-label="Mark ${t[0]} done" ${get(key(dk,id))?'checked':''}><h3>${n}. ${t[0]}</h3><span class="badge">${t[3]}</span></div>
 <div class="meta">${t[1]} — ${t[2]}</div>${id=='abductor'||id=='adductor'?`<div class="wk"><button data-w="0" aria-pressed="${id=='abductor'}">Week A · Abductor</button><button data-w="1" aria-pressed="${id=='adductor'}">Week B · Adductor</button></div>`:''}
 <h4>Set up</h4><p>${t[4]}</p><h4>How to do it</h4><ol>${t[5].map(s=>`<li>${s}</li>`).join('')}</ol><h4>Avoid</h4><p class="avoid">${t[6]}</p></div></article>`}
function day(){live.length=0;const d=DAYS[cur];let n=0,tot=0;
 let h=`<div class="day"><div><h2>${d[1]}</h2><p>${d[2]}</p></div><div class="prog"><div><i id="bar"></i></div><span id="pt"></span></div></div>`;
 if(d[3])h+=`<p class="note">${d[3]}</p>`;
 for(const[g,ids]of d[4]){h+=`<div class="grp">${g}</div>`;for(let id of ids){if(id=='abd|add')id=alt?'adductor':'abductor';n++;h+=card(d[0],id,n)}}
 tot=n;$('#main').innerHTML=h;wire(d[0],tot)}
function wire(dk,tot){
 const upd=()=>{const c=document.querySelectorAll('.chk:checked').length;$('#bar').style.width=c/tot*100+'%';$('#pt').textContent=c+' of '+tot+' done'};
 document.querySelectorAll('.card').forEach(el=>{let id=el.dataset.id;const o={el,e:X[id],g:el.querySelector('svg g'),mode:reduce?'A':'play',t0:performance.now(),u:-1};live.push(o);
  el.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{o.mode=b.dataset.m;o.u=-1;el.querySelectorAll('.chips button').forEach(x=>x.setAttribute('aria-pressed',x==b))});
  const c=el.querySelector('.chk');c.onchange=()=>{set(key(dk,id),c.checked);el.classList.toggle('done',c.checked);upd()};el.classList.toggle('done',c.checked);
  el.querySelectorAll('.wk button').forEach(b=>b.onclick=()=>{alt=+b.dataset.w;day()})});upd()}
tabs();day();
</script></body></html>
